server:
  host: 127.0.0.1
  port: 5090
  state_dir: ~/.marvo
  # 旧单用户数据目录，仅用于迁移；多用户数据写入 state_dir/users。
  data_dir: ~/.marvo/data
  cors_origins:
    - http://localhost:5080

auth:
  password: marvo

opencode:
  # 仅用于把旧版单用户 OpenCode 会话和凭据迁入某个用户空间。
  legacy_home_dir: ~/.marvo/opencode-state/home

runtime:
  url: http://127.0.0.1:4097
  token_file: ~/.marvo/control/.runtime-token

log:
  level: info
  # file: /var/log/marvo.log
