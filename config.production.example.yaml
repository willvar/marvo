server:
  host: 127.0.0.1
  port: 9989
  state_dir: /var/lib/marvo
  # 旧单用户数据目录，仅用于迁移；多用户数据写入 state_dir/users。
  data_dir: /var/lib/marvo/data
  cors_origins:
    - https://YOUR_FRONTEND_DOMAIN

auth:
  password: CHANGE_ME

opencode:
  legacy_home_dir: /var/lib/marvo/opencode-state/home

runtime:
  url: http://127.0.0.1:4097
  token_file: /var/lib/marvo/control/.runtime-token

log:
  level: info
  file: /var/log/marvo/marvo.log
