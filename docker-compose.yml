services:
  opencode:
    container_name: opencode
    image: ghcr.io/anomalyco/opencode:latest
    command: ["serve", "--hostname", "0.0.0.0", "--port", "4096"]
    network_mode: host
    working_dir: ${OPENCODE_DIR:-/workspace}
    volumes:
      - ./docker/opencode.json:/root/.config/opencode/opencode.json:ro
      - ./docker/auth.json:/root/.local/share/opencode/auth.json:ro
      - ${MARVO_DATA_DIR:-~/.marvo/data}:/workspace
